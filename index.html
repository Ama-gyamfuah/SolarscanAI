<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SOLAR SCAN — Photovoltaic Defect Diagnostic Console</title>
    <meta name="description" content="SOLAR SCAN is an automated photovoltaic diagnostic console demonstrating high-precision defect detection with edge YOLOv8 and Google Cloud Vision API integration." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#030712" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          if (window.location.protocol === 'https:') {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Service Worker active:', reg.scope))
              .catch(err => console.warn('Service Worker registration skipped:', err));
          } else {
            // In HTTP / LAN testing, cleanly unregister stale workers to protect Safari WebKit
            navigator.serviceWorker.getRegistrations().then(registrations => {
              for (let registration of registrations) {
                registration.unregister();
              }
            }).catch(() => {});
          }
        });
      }
    </script>
  </body>
</html>
